<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Preview</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="engine/engine.css">
  <link rel="stylesheet" href="engine/heritage.css">
</head>
<body>
  <div id="app"></div>
  <script src="engine/templates.js"></script>
  <script src="engine/templates-heritage.js"></script>
  <script src="engine/catalog.js"></script>
  <script src="engine/heritage.js"></script>
  <script src="engine/engine.js"></script>
  <script>
    (() => {
      const q = new URLSearchParams(location.search);
      const t = q.get('t'), c = q.get('c');
      const tpl = window.KEEPSAKE_TEMPLATES[t] || window.KEEPSAKE_TEMPLATES.anniversary;
      const site = JSON.parse(JSON.stringify(tpl.site));
      const C = window.KEEPSAKE_CATALOG;
      if (c && tpl.cultures) C.applyCulture(site, c);
      else if (site.culture && !(site.style && site.style.colors)) C.applyCulture(site, site.culture);
      if (q.get('nocover') === '1') site.sections = site.sections.filter(x => x.type !== 'cover');
      Keepsake.render(site);
      window.addEventListener('message', e => {
        if (e.origin !== location.origin || !e.data || e.data.type !== 'keepsake:site') return;
        const y = window.scrollY;
        Keepsake.render(e.data.site);
        requestAnimationFrame(() => window.scrollTo(0, y));
      });
      if (window.parent !== window) window.parent.postMessage({ type: 'keepsake:ready' }, location.origin);
    })();
  </script>
</body>
</html>
