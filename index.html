<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keepsake</title>
  <meta name="description" content="Pick a template, add your words and photos, and download a one-of-a-kind website for someone you love.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Gochi+Hand&family=Gloock&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #EEEDF2; --ink: #17161C; --muted: #6A6875; --line: #E1DFE8; --brand: #E0245E; --card: #fff; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Manrope", system-ui, sans-serif; line-height: 1.5; }
    :focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 6px; }
    .wrap { max-width: 1240px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 40px); }
    header { padding: 22px 0; display: flex; align-items: center; gap: 10px; font-weight: 800; }
    .mark { width: 32px; height: 32px; display: grid; place-items: center; border-radius: 10px; background: var(--brand); color: #fff; }
    .intro { padding: 6vh 0 7vh; max-width: 46rem; }
    .intro .hand { font-family: "Gochi Hand", cursive; font-size: 1.6rem; color: var(--brand); margin: 0; }
    h1 { font-family: "Gloock", Georgia, serif; font-weight: 400; font-size: clamp(2.6rem, 1.6rem + 4.6vw, 5.4rem); line-height: 1; letter-spacing: -.02em; margin: .1em 0 .3em; }
    .intro p.lead { font-size: 1.15rem; color: var(--muted); margin: 0; }
    .steps { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-top: 22px; padding: 0; list-style: none; font-weight: 700; font-size: .95rem; }
    .steps li::before { content: attr(data-n); display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ink); color: #fff; font-size: .75rem; margin-right: 8px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 22px; padding-bottom: 12vh; }
    .tpl { background: var(--card); border-radius: 20px; overflow: hidden; border: 1px solid var(--line); display: flex; flex-direction: column; transition: transform .3s ease, box-shadow .3s ease; }
    .tpl:hover { transform: translateY(-3px); box-shadow: 0 24px 50px rgba(0,0,0,.1); }
    .shot { position: relative; aspect-ratio: 16 / 10; overflow: hidden; background: #ddd; }
    .shot iframe { position: absolute; top: 0; left: 0; width: 1280px; height: 800px; border: 0; transform-origin: 0 0; pointer-events: none; }
    .info { padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .info h2 { margin: 0; font-size: 1.25rem; }
    .info p { margin: 0; color: var(--muted); font-size: .95rem; flex: 1; }
    .acts { display: flex; gap: 10px; margin-top: 8px; }
    .acts a { flex: 1; text-align: center; text-decoration: none; padding: 11px 12px; border-radius: 11px; font-weight: 800; }
    .use { background: var(--brand); color: #fff; box-shadow: 0 6px 16px rgba(224,36,94,.25); }
    .peek { border: 1px solid var(--line); color: var(--ink); }
    footer { color: var(--muted); font-size: .9rem; padding: 0 0 6vh; }
  </style>
</head>
<body>
  <div class="wrap">
    <header><span class="mark" aria-hidden="true">♥</span> Keepsake</header>
    <section class="intro">
      <p class="hand">say it properly,</p>
      <h1>A little website for someone you love.</h1>
      <p class="lead">Pick an occasion, add your own words and photos, and download a page they'll scroll through slowly.</p>
      <ol class="steps"><li data-n="1">Pick a template</li><li data-n="2">Add words & photos</li><li data-n="3">Download & share</li></ol>
    </section>
    <main class="grid" id="grid"></main>
    <footer>Made by LamTech Solutions.</footer>
  </div>
  <script src="engine/templates.js"></script>
  <script>
    (() => {
      const T = window.KEEPSAKE_TEMPLATES;
      const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const grid = document.getElementById('grid');
      grid.innerHTML = Object.entries(T).map(([k, t]) => `
        <article class="tpl">
          <div class="shot"><iframe src="preview.html?t=${k}" title="${esc(t.name)} preview" loading="lazy" tabindex="-1" aria-hidden="true"></iframe></div>
          <div class="info">
            <h2>${esc(t.name)}</h2>
            <p>${esc(t.blurb)}</p>
            <div class="acts"><a class="peek" href="preview.html?t=${k}" target="_blank" rel="noopener">Preview</a><a class="use" href="builder.html?t=${k}">Use this</a></div>
          </div>
        </article>`).join('');
      const fit = () => document.querySelectorAll('.shot').forEach(s => { s.querySelector('iframe').style.transform = `scale(${s.clientWidth / 1280})`; });
      fit(); window.addEventListener('resize', fit);
    })();
  </script>
</body>
</html>
