<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My projects · Keepsake</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..800&family=Gochi+Hand&family=Gloock&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body class="app-page">
  <div class="app-wrap">
    <header class="app-top">
      <a class="app-brand" href="index.html"><span class="mark" aria-hidden="true">♥</span> Keepsake</a>
      <nav class="app-nav">
        <a href="index.html">Templates</a>
        <a href="pricing.html">Pricing</a>
        <button type="button" id="signout">Sign out</button>
      </nav>
    </header>
    <section class="dash-head">
      <div>
        <h1 class="serif" id="hi">Your projects</h1>
        <p id="who"></p>
      </div>
      <div class="k-row"><a class="k-btn" href="index.html">New project</a></div>
    </section>
    <div class="plan-bar" id="plan-bar" hidden></div>
    <nav class="d-tabs" id="d-tabs" role="tablist" hidden>
      <button type="button" role="tab" data-tab="projects" aria-selected="true">Projects</button>
      <button type="button" role="tab" data-tab="admin" aria-selected="false">Admin</button>
    </nav>
    <main id="projects"><div class="p-grid"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div></main>
    <main id="admin" hidden></main>
    <footer class="app-foot"><span>Keepsake by LamTech Solutions</span><a href="pricing.html">Plans</a><a id="support" href="#">Support</a></footer>
  </div>
  <script src="vendor/supabase-2.45.4.js"></script>
  <script src="config.js"></script>
  <script src="cloud.js"></script>
  <script src="engine/templates.js"></script>
  <script src="engine/templates-heritage.js"></script>
  <script>
    (async () => {
      const K = window.KCloud, C = K.config, esc = K.esc, T = window.KEEPSAKE_TEMPLATES;
      const $ = s => document.querySelector(s);
      $('#support').href = 'mailto:' + C.supportEmail + '?subject=' + encodeURIComponent('Keepsake support');
      $('#signout').addEventListener('click', () => K.signOut());
      if (!K.ready) { $('#projects').innerHTML = '<div class="empty"><h2>Accounts are not set up</h2></div>'; return; }
      const u = await K.requireAuth(); if (!u) return;
      let me, list = [];
      try { me = await K.profile(true); } catch (e) { me = { plan: 'free', email: u.email }; }

      const first = (me.full_name || '').split(' ')[0];
      $('#hi').textContent = first ? `Hi ${first}, your projects` : 'Your projects';
      $('#who').textContent = me.email;
      const paid = K.isPaid(me);
      const when = d => new Date(d).toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      const ago = d => { const m = Math.round((Date.now() - new Date(d)) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : m < 1440 ? `${Math.round(m / 60)} h ago` : when(d); };

      function planBar() {
        const bar = $('#plan-bar'); bar.hidden = false;
        if (paid) { bar.innerHTML = `<span class="k-plan">${esc(C.plans[me.plan].name)}</span><span>Unlimited projects and pages. Thank you for supporting Keepsake.</span>`; return; }
        const lim = C.limits.free, n = list.length, pub = list.filter(p => p.published).length;
        bar.innerHTML = `<span class="k-plan free">Free</span>
          <span><b>${n}</b> of ${lim.projects} projects · <b>${pub}</b> of ${lim.published} published</span>
          <span class="meter" aria-hidden="true"><i style="width:${Math.min(100, n / lim.projects * 100)}%"></i></span>
          <a class="k-btn gold sm" href="pricing.html">Upgrade to Pro</a>`;
      }

      /* ---------- projects ---------- */
      async function load() {
        const { data, error } = await K.projects.list();
        if (error) { $('#projects').innerHTML = `<div class="empty"><h2>Couldn't load your projects</h2><p>${esc(K.nice(error))}</p><button class="k-btn" onclick="location.reload()">Try again</button></div>`; return; }
        list = data; planBar(); draw();
      }
      function draw() {
        if (!list.length) {
          $('#projects').innerHTML = `<div class="empty"><h2 class="serif">Nothing saved yet</h2><p>Pick a template, add your words and photos, and it saves here automatically.</p><a class="k-btn" href="index.html">Choose a template</a></div>`;
          return;
        }
        $('#projects').innerHTML = `<div class="p-grid">${list.map(p => {
          const t = T[p.template] || {};
          return `<article class="p-card" data-id="${p.id}">
            <a class="p-shot" href="builder.html?id=${p.id}" aria-label="Open ${esc(p.title)}">
              <span class="p-status${p.published ? ' live' : ''}">${p.published ? 'Live' : 'Draft'}</span>
              <iframe data-id="${p.id}" title="" tabindex="-1" aria-hidden="true" loading="lazy"></iframe>
            </a>
            <div class="p-info">
              <h3>${esc(p.title || 'Untitled')}</h3>
              <span class="meta">${esc(t.name || p.template)}${t.premium ? ' · Premium' : ''} · edited ${esc(ago(p.updated_at))}</span>
              ${p.published && p.slug ? `<a class="live-link" href="${esc(K.pageUrl(p.slug))}" target="_blank" rel="noopener">${esc(location.host)}/p/${esc(p.slug)}</a>` : ''}
            </div>
            <div class="p-acts">
              <a class="k-btn sm" href="builder.html?id=${p.id}">Edit</a>
              <button type="button" class="k-btn ghost sm" data-act="publish">${p.published ? 'Share' : 'Publish'}</button>
              <button type="button" class="k-btn ghost sm" data-act="rsvps">RSVPs</button>
              <button type="button" class="k-btn ghost sm" data-act="dup" title="Duplicate">Copy</button>
              <button type="button" class="k-btn ghost sm danger" data-act="del" title="Delete">Delete</button>
            </div>
          </article>`;
        }).join('')}</div>`;
        previews();
      }

      // previews: each iframe loads the engine, then we post the saved site
      const siteCache = {};
      let io;
      function previews() {
        const fit = () => document.querySelectorAll('.p-shot').forEach(s => { const f = s.querySelector('iframe'); if (f) f.style.transform = `scale(${s.clientWidth / 1280})`; });
        fit(); window.onresize = fit;
        if (io) io.disconnect();
        io = new IntersectionObserver(es => es.forEach(e => {
          if (!e.isIntersecting) return; io.unobserve(e.target);
          const p = list.find(x => x.id === e.target.dataset.id);
          e.target.src = `preview.html?t=${encodeURIComponent(p.template)}&nocover=1&embed=1`;
        }), { rootMargin: '200px' });
        document.querySelectorAll('.p-shot iframe').forEach(f => io.observe(f));
      }
      window.addEventListener('message', async e => {
        if (e.origin !== location.origin || !e.data || e.data.type !== 'keepsake:ready') return;
        const f = [...document.querySelectorAll('.p-shot iframe')].find(x => x.contentWindow === e.source); if (!f) return;
        const id = f.dataset.id;
        if (!siteCache[id]) { const { data } = await K.projects.get(id); siteCache[id] = data && data.site; }
        const site = siteCache[id]; if (!site) return;
        const s = JSON.parse(JSON.stringify(site)); s.sections = (s.sections || []).filter(x => x.type !== 'cover');
        e.source.postMessage({ type: 'keepsake:site', site: s }, location.origin);
      });

      $('#projects').addEventListener('click', async e => {
        const b = e.target.closest('button[data-act]'); if (!b) return;
        const id = b.closest('.p-card').dataset.id, p = list.find(x => x.id === id);
        if (b.dataset.act === 'publish') K.publishDialog(p, upd => { Object.assign(p, upd); planBar(); draw(); });
        if (b.dataset.act === 'rsvps') rsvps(p);
        if (b.dataset.act === 'dup') {
          b.disabled = true;
          const { data: full } = await K.projects.get(id);
          const { data, error } = await K.projects.create(p.template, full.site, (p.title + ' (copy)').slice(0, 160));
          b.disabled = false;
          if (error) { alertBox(K.nice(error)); return; }
          list.unshift(data); planBar(); draw();
        }
        if (b.dataset.act === 'del') {
          if (b.dataset.armed !== '1') { b.dataset.armed = '1'; b.textContent = 'Sure?'; setTimeout(() => { if (b.isConnected) { b.dataset.armed = ''; b.textContent = 'Delete'; } }, 3000); return; }
          const { error } = await K.projects.remove(id);
          if (error) { alertBox(K.nice(error)); return; }
          list = list.filter(x => x.id !== id); planBar(); draw();
        }
      });

      function alertBox(text) {
        const m = K.modal(`<h2>Heads up</h2><p class="k-sub">${esc(text)}</p><div class="k-row end">${/Pro|plan/.test(text) ? '<a class="k-btn gold" href="pricing.html">See plans</a>' : ''}<button type="button" class="k-btn ghost" data-ok>OK</button></div>`);
        m.el.querySelector('[data-ok]').addEventListener('click', m.close);
      }

      /* ---------- RSVPs ---------- */
      async function rsvps(p) {
        const m = K.modal(`<h2>RSVPs · ${esc(p.title)}</h2><p class="k-sub">${p.published ? 'Replies from your published page.' : 'Publish this page to start collecting RSVPs.'}</p><div id="r-body"><div class="skeleton" style="height:120px;margin-top:14px"></div></div>`, { wide: true });
        const { data, error } = await K.projects.rsvps(p.id);
        const body = m.el.querySelector('#r-body');
        if (error) { body.innerHTML = `<p class="k-msg bad">${esc(K.nice(error))}</p>`; return; }
        // keep each guest's latest reply
        const seen = new Set(), latest = data.filter(r => { const k = r.name.trim().toLowerCase(); if (seen.has(k)) return false; seen.add(k); return true; });
        const yes = latest.filter(r => r.attending), no = latest.filter(r => !r.attending);
        const people = yes.reduce((a, r) => a + (r.guests || 1), 0);
        const meals = {}; yes.forEach(r => (r.meals || []).forEach(x => { meals[x] = (meals[x] || 0) + 1; }));
        body.innerHTML = `
          <div class="stats">
            <div class="stat"><b>${people}</b><span>people coming</span></div>
            <div class="stat"><b>${yes.length}</b><span>replies: yes</span></div>
            <div class="stat"><b>${no.length}</b><span>replies: can't make it</span></div>
            ${Object.entries(meals).map(([k, v]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join('')}
          </div>
          ${latest.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Reply</th><th>Guests</th><th>Meals</th><th>Dietary</th><th>Song</th><th>Message</th><th>When</th></tr></thead><tbody>
            ${latest.map(r => `<tr><td><b>${esc(r.name)}</b></td><td><span class="pill ${r.attending ? 'yes' : 'no'}">${r.attending ? 'Coming' : 'Can\'t come'}</span></td><td>${r.attending ? r.guests : '–'}</td><td>${esc((r.meals || []).join(', '))}</td><td>${esc(r.dietary || '')}</td><td>${esc(r.song || '')}</td><td>${esc(r.message || '')}</td><td>${esc(ago(r.created_at))}</td></tr>`).join('')}
          </tbody></table></div>` : '<p class="k-msg">No replies yet. Share your link to start collecting them.</p>'}
          <div class="k-row end">
            ${latest.length ? (paid ? '<button type="button" class="k-btn ghost" id="csv">Download CSV</button>' : '<a class="k-btn gold" href="pricing.html">CSV export with Pro</a>') : ''}
            ${p.published ? '<button type="button" class="k-btn" id="share">Share link</button>' : '<button type="button" class="k-btn" id="share">Publish</button>'}
          </div>`;
        const csvBtn = body.querySelector('#csv');
        if (csvBtn) csvBtn.addEventListener('click', () => {
          const cell = v => { let s = String(v ?? ''); if (/^[=+\-@\t\r]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
          const rows = [['Name', 'Reply', 'Guests', 'Meals', 'Dietary', 'Song', 'Message', 'Date']].concat(latest.map(r => [r.name, r.attending ? 'Coming' : "Can't come", r.attending ? r.guests : 0, (r.meals || []).join('; '), r.dietary, r.song, r.message, new Date(r.created_at).toISOString()]));
          const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `${K.slugify(p.title) || 'rsvps'}-rsvps.csv`; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
        });
        body.querySelector('#share').addEventListener('click', () => { m.close(); K.publishDialog(p, upd => { Object.assign(p, upd); planBar(); draw(); }); });
      }

      /* ---------- admin ---------- */
      if (me.is_admin) {
        $('#d-tabs').hidden = false;
        $('#d-tabs').addEventListener('click', e => {
          const b = e.target.closest('button'); if (!b) return;
          document.querySelectorAll('#d-tabs button').forEach(x => x.setAttribute('aria-selected', String(x === b)));
          $('#projects').hidden = b.dataset.tab !== 'projects'; $('#admin').hidden = b.dataset.tab !== 'admin';
          if (b.dataset.tab === 'admin') admin();
        });
      }
      async function admin() {
        const box = $('#admin');
        box.innerHTML = '<div class="skeleton" style="height:200px"></div>';
        const { data, error } = await K.sb.rpc('admin_overview');
        if (error) { box.innerHTML = `<p class="k-msg bad">${esc(K.nice(error))}</p>`; return; }
        const paidN = data.filter(r => r.plan !== 'free').length;
        const mrr = data.reduce((a, r) => a + (C.plans[r.plan] ? C.plans[r.plan].price : 0), 0);
        const reqs = data.filter(r => r.open_request);
        box.innerHTML = `
          <div class="stats" style="margin-top:0">
            <div class="stat"><b>${data.length}</b><span>accounts</span></div>
            <div class="stat"><b>${paidN}</b><span>paying</span></div>
            <div class="stat"><b>${C.currency}${mrr.toLocaleString()}</b><span>monthly revenue (plans)</span></div>
            <div class="stat"><b>${data.reduce((a, r) => a + Number(r.projects), 0)}</b><span>projects</span></div>
            <div class="stat"><b>${data.reduce((a, r) => a + Number(r.published), 0)}</b><span>live pages</span></div>
            <div class="stat"><b>${data.reduce((a, r) => a + Number(r.rsvps), 0)}</b><span>RSVPs</span></div>
            <div class="stat"><b>${reqs.length}</b><span>upgrade requests</span></div>
          </div>
          <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Account</th><th>Joined</th><th>Projects</th><th>Live</th><th>RSVPs</th><th>Request</th><th>Plan</th></tr></thead><tbody>
          ${data.map(r => `<tr><td><b>${esc(r.full_name || '–')}</b><br><span style="color:var(--muted)">${esc(r.email)}</span>${r.is_admin ? ' <span class="pill yes">admin</span>' : ''}</td>
            <td>${esc(when(r.created_at))}</td><td>${r.projects}</td><td>${r.published}</td><td>${r.rsvps}</td>
            <td>${r.open_request ? `<span class="pill no">wants ${esc(C.plans[r.open_request].name)}</span>` : ''}</td>
            <td><select data-user="${r.user_id}" aria-label="Plan for ${esc(r.email)}">${Object.keys(C.plans).map(k => `<option value="${k}" ${k === r.plan ? 'selected' : ''}>${esc(C.plans[k].name)}</option>`).join('')}</select></td></tr>`).join('')}
          </tbody></table></div>
          <p class="k-msg" id="a-msg" aria-live="polite">Change a plan after payment comes in. The customer sees it next time they load the page.</p>`;
        box.querySelectorAll('select[data-user]').forEach(s => s.addEventListener('change', async () => {
          const { error } = await K.sb.rpc('admin_set_plan', { p_user: s.dataset.user, p_plan: s.value });
          $('#a-msg').textContent = error ? K.nice(error) : 'Plan updated.';
          $('#a-msg').className = 'k-msg ' + (error ? 'bad' : 'good');
        }));
      }

      load();
    })();
  </script>
</body>
</html>
